<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d40000">
    <title>Sin conexión - ByH ERP</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #212529;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 16px;
        }

        img {
            width: 140px;
            height: 140px;
        }

        h1 {
            color: #d40000;
            font-size: 1.5rem;
            margin: 16px 0 8px;
        }

        p {
            margin: 0 0 24px;
            color: #6c757d;
        }

        button {
            background: #d40000;
            color: #ffffff;
            border: 0;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <img src="/icons/icon-192.png" alt="EDS El Portal de Tunja">
        <h1>Sin conexión a internet</h1>
        <p>El ERP necesita conexión para consultar y guardar planillas.<br>Revise la red e intente de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>

</html>
